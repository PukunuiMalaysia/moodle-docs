name: Product bug
description: Report unexpected behaviour in a documented Pukunui product.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: product
    attributes:
      label: Product and version
      placeholder: Boleh 5.3.2
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform version
      description: Enter the Moodle or Chrome version relevant to the problem.
      placeholder: Moodle 5.2.1 or Chrome 140
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and reproduction steps
      description: Remove personal data, credentials, private URLs, and confidential logs.
    validations:
      required: true
