name: Documentation correction
description: Report missing, incorrect, or unclear public documentation.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: product
    attributes:
      label: Product or documentation area
      description: Enter the public product name, or use "Documentation site" for a site-wide issue.
      placeholder: SocialLink
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Documentation page
      placeholder: https://pukunuimalaysia.github.io/moodle-docs/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs correcting?
      description: Do not include credentials, personal data, or private site details.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
    validations:
      required: false
