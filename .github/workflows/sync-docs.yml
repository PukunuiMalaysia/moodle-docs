name: Synchronize public documentation

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DOCS_SOURCE_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_SOURCE_APP_PRIVATE_KEY }}
          owner: PukunuiMalaysia
          permission-contents: read

      - name: Create documentation pull request token
        id: pull-request-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DOCS_SOURCE_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_SOURCE_APP_PRIVATE_KEY }}
          owner: PukunuiMalaysia
          repositories: moodle-docs
          permission-contents: read
          permission-pull-requests: write

      - name: Run synchronization unit tests
        run: python3 -m unittest discover -s tests

      - name: Publish selected public products
        id: sync
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          result_file="$RUNNER_TEMP/sync-result.json"
          python3 scripts/sync_docs.py --result-file "$result_file"
          echo "retirement_only=$(python3 -c 'import json, sys; print(str(json.load(open(sys.argv[1], encoding="utf-8"))["retirement_only"]).lower())' "$result_file")" >> "$GITHUB_OUTPUT"
          echo "added_count=$(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))["added"]))' "$result_file")" >> "$GITHUB_OUTPUT"
          echo "updated_count=$(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))["updated"]))' "$result_file")" >> "$GITHUB_OUTPUT"
          echo "removed_count=$(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))["removed"]))' "$result_file")" >> "$GITHUB_OUTPUT"
          echo "removed=$(python3 -c 'import json, sys; print(", ".join(json.load(open(sys.argv[1], encoding="utf-8"))["removed"]))' "$result_file")" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.280.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build synchronized site
        run: bundle exec jekyll build --baseurl /moodle-docs --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Check generated links
        run: python3 scripts/check_links.py _site /moodle-docs

      - name: Check public image signatures and dimensions
        run: python3 scripts/image_checks.py products

      - name: Audit external links
        run: python3 scripts/check_external_links.py _site

      - name: Create or update synchronization branch
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- products _data/provenance.yml _data/repositories.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin automation/docs-sync:refs/remotes/origin/automation/docs-sync || true
          git switch -C automation/docs-sync
          git config user.name "pukunui-docs[bot]"
          git config user.email "pukunui-docs[bot]@users.noreply.github.com"
          git add -- products _data/provenance.yml _data/repositories.yml
          git commit -m "docs: synchronize public product documentation"
          git push --force-with-lease --set-upstream origin automation/docs-sync
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open synchronization pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.pull-request-token.outputs.token }}
        run: |
          title="docs: synchronize public product documentation"
          if [ "${{ steps.sync.outputs.retirement_only }}" = "true" ]; then
            title="docs: retire public product documentation"
          fi
          body_file="$(mktemp)"
          printf '%s\n' \
            '## Summary' \
            '' \
            '- discovers only repositories selected in the read-only source App installation' \
            '- publishes only approved `product_availability` states from validated central `content/products/**` sources' \
            '- generates the public catalog and provenance from repository properties and central content' \
            "- added: ${{ steps.sync.outputs.added_count }}; updated: ${{ steps.sync.outputs.updated_count }}; removed: ${{ steps.sync.outputs.removed_count }}" \
            '' \
            '## Validation' \
            '' \
            '- synchronization unit tests' \
            '- strict Jekyll production build at `/moodle-docs`' \
            '- generated local-link check' > "$body_file"
          if [ -n "${{ steps.sync.outputs.removed }}" ]; then
            printf '%s\n' '' "Removed public routes: ${{ steps.sync.outputs.removed }}" >> "$body_file"
          fi
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/docs-sync --base main --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file"
            pull_request="$existing"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head automation/docs-sync \
              --title "$title" --body-file "$body_file"
            pull_request="$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/docs-sync --base main --state open --json number --jq '.[0].number')"
          fi
          if [ "${{ steps.sync.outputs.retirement_only }}" = "true" ]; then
            gh pr merge "$pull_request" --repo "$GITHUB_REPOSITORY" --auto --squash \
              --match-head-commit "$(git rev-parse HEAD)"
          elif [ "$(gh pr view "$pull_request" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            gh pr merge "$pull_request" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi
